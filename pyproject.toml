[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sortbot-sim"
version = "0.1.0"
description = "Симуляция мобильного манипулятора, сортирующего цветные кубики, в MuJoCo"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=4.0,<5",
    "numpy",
    "pillow",
]

[tool.setuptools]
packages = ["sortbot_sim"]
