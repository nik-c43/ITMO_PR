[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sortbot-sim"
version = "0.1.0"
description = "Симуляция мобильного манипулятора, сортирующего цветные кубики, в MuJoCo"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=4.0,<5",
    "numpy",
    "opencv-python-headless",
    "pillow",
]

[tool.setuptools]
packages = ["sortbot_motion", "sortbot_sim", "sortbot_task", "sortbot_vision"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
# Тесты пакета ROS (ros/sortbot_ros/test) запускаются отдельно, в контейнере: им нужен ROS 2.
testpaths = ["tests"]
